spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  auth:
    dev-mock:
      enabled: false
      user-id: 00000000-0000-0000-0000-000000000001
      user-email: dev-employer@occupify.local
  rabbitmq:
    exchange: occupify.notification.exchange
    queue: occupify.notification.queue
    routing-key: notification.#
    dlx-exchange: occupify.notification.dlx
    dlq-queue: occupify.notification.dlq
    dlq-routing-key: notification.dlq
    user-exchange: occupify.user.exchange
    user-queue: occupify.notification.user.queue
    user-routing-key: user.#
    contract-exchange: occupify.contract.exchange
    contract-queue: occupify.notification.contract.queue
    contract-accepted-routing-key: contract.accepted
    contract-rejected-routing-key: contract.rejected
    contract-compensation-routing-key: contract.compensation.#
    project-queue: occupify.notification.project.queue
    project-routing-key: project.#
    bid-queue: occupify.notification.bid.queue
    bid-routing-key: bid.#
